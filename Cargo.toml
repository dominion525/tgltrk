[package]
name = "tgltrk"
version = "0.1.2"
edition = "2024"
rust-version = "1.85.0"
description = "Unofficial Toggl Track CLI — manage timers, entries, projects, clients, and tags from the command line"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dominion525/tgltrk"
homepage = "https://github.com/dominion525/tgltrk"
readme = "README.md"
keywords = ["toggl", "time-tracking", "cli", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
keyring = "3"
directories = "5"
rpassword = "5"
unicode-width = "0.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
tempfile = "3"
wiremock = "0.6"
